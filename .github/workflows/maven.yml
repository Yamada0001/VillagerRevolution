# Java CI with Maven — BetterVillagers
# 参考: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 同一分支上新推送时取消进行中的运行，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：构建仅需读取仓库内容
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 pom.xml 中 <java.version>25</java.version> 保持一致
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: BetterVillagers
          path: target/BetterVillagers-*.jar
          if-no-files-found: error
          retention-days: 14
