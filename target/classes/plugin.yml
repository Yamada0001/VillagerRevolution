name: BetterVillagers
version: '1.0.0'
main: dev.bettervillagers.BetterVillagersPlugin
api-version: '26.2'
load: POSTWORLD
author: BetterVillagers Team
description: 赋予 Minecraft 村民智能 AI 行为系统
website: https://jd.papermc.io/paper/26.2/

# 规范 0.1：Folia 区域化多线程支持声明
folia-supported: true

commands:
  bettervillagers:
    description: BetterVillagers 主命令
    usage: /bv help
    aliases: [bv]
    permission: bettervillagers.use
    permission-message: "&c你没有权限执行此命令。"

permissions:
  bettervillagers.use:
    description: 允许使用基础命令
    default: true
  bettervillagers.admin:
    description: 完全管理权限
    default: op
  bettervillagers.redstone.create:
    description: 创建生电保护区
    default: op
  bettervillagers.redstone.modify:
    description: 修改生电保护区
    default: op
  bettervillagers.redstone.delete:
    description: 删除生电保护区
    default: op
