# ============================================================
# BetterVillagers 职业数据（规范 2.x / 6.3）
# ver: 配置版本号（勿手动修改，由 Ver.java 控制）
# 每个职业：stats / equipment / 行为权重 / 性格 / 方块白名单 / 交易商品
# trades（问题6）：每个职业的丰富交易列表，支持附魔装备/武器/工具
#   - material: 物品材质
#     amount: 数量（默认 1）
#     min-price / max-price: 绿宝石价格区间
#     enchants: 附魔列表 [{name, level}]
# ============================================================
