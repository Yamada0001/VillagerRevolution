ver: 6
plugin:
  language: "zh_CN"
  debug-mode: false
  auto-save-interval: 300   # 秒（WAL 定时保存）

# ---------- AI 配置（规范 1.x） ----------
ai:
  provider: "openai"        # 可选: openai, claude, deepseek, glm, kimi, custom
  timeout: 90               # 单次请求超时（秒）
  max-tokens: 4443
  temperature: 0.7
  retry-attempts: 3         # 指数退避重试次数（初始 1s，上限 8s）
  max-concurrent-requests: 8  # 全局并发上限 越多越费Token 吃并发
  requests-per-second: 5.0    # 令牌桶限流速率
  fallback-providers: ["glm"]    # 三级降级链备用 provider，如 ["deepseek","glm"]
  memory:
    max-history: 50         # AI 对话历史最大条目
    context-keep-recent: 12 # 裁剪后保留最近条数
  cache:
    decision-ttl: 300       # 决策缓存 TTL（秒）
    max-size: 2000
  # 各 provider 独立凭证
  providers:
    openai:
      api-key: ""
      api-endpoint: "https://api.openai.com/v1"
      model: "gpt-5.4-mini"
    claude:
      api-key: ""
      api-endpoint: "https://api.anthropic.com"
      model: "claude-fable-5"
    deepseek:
      api-key: ""
      api-endpoint: "https://api.deepseek.com/v1"
      model: "deepseek-v4-flash"
    glm:
      api-key: ""
      api-endpoint: "https://open.bigmodel.cn/api/paas/v4"
      model: "glm-4-flash"
    kimi:
      api-key: ""
      api-endpoint: "https://api.moonshot.cn/v1"
      model: "kimi-k3"
    custom:
      api-key: ""
      api-endpoint: ""
      model: ""

# ---------- 熔断器 ----------
circuit-breaker:
  enabled: true
  failure-threshold-percent: 50  # 统计窗口内失败率阈值
  min-requests: 10               # 触发统计的最小请求数
  open-duration: 60              # 熔断持续时间（秒）
  window-seconds: 60             # 滚动统计窗口（秒）

# ---------- 性能配置 ----------
performance:
  async-threads: 6
  max-active-ai-villagers: 50   # 同时激活 AI 的村民数量
  ai-update-interval: 5         # 战术层 AI 思考间隔（秒）
  strategic-interval: 60        # 战略层 AI 间隔（秒）
  pathfinding-range: 32         # 寻路最大范围（方块）
  block-operation-cooldown: 10  # 方块操作冷却（秒）
  trade-calculation-cache: 300  # 交易价格缓存（秒）
  trade-cache-max-size: 2000    # 交易价格缓存最大条目
  trade-quantize-step: 8        # 供需量化步长

# ---------- 功能开关 ----------
features:
  ai-behavior: true
  block-interaction: true
  autonomous-building: true
  self-defense: true
  auto-trading: true
  profession-tasks: true    # 各职业核心职责行为（农民种地/军事巡逻/矿工挖矿等）
  social-interaction: true  # 跨职业村民相遇驻足攀谈社交

# ---------- 村民社交与头顶气泡 ----------
social:
  encounter-range: 3.5
  encounter-height: 2.0
  chat-duration-seconds: 5
  chat-cooldown-seconds: 30
  chat-max-length: 32
  trade-chance: 0.35
  affinity-per-trade: 5
  breeding-threshold: 80
  breeding-cooldown-seconds: 1200
  max-discount-percent: 25
  affinity-points-per-special-price: 10
  bubble:
    enabled: true
    height: 0.6
    reply-interval-ticks: 40
    chat-duration-ticks: 100
    chat-bubble-duration-ticks: 35
    trade-duration-ticks: 60
    item-spacing: 0.35

# ---------- 村庄外交 ----------
diplomacy:
  enabled: true
  review-interval-seconds: 600  # 同一对村庄至少间隔 10 分钟才重新决策
  relations: {}                 # 可选初始值，例如 "1-2": ALLY；数据库决策优先

# ---------- 村庄集体活动 ----------
activities:
  enabled: true
  interval-seconds: 1800
  duration-seconds: 180

# ---------- 国王住房大基建 ----------
building:
  housing:
    emergency-minimum-population: 12  # 达到该人口后才检查住房紧缺
    residents-per-house: 3            # 每栋已建/在建住宅的规划容纳人数
    reserve-houses: 4                 # 在人口刚好住满时额外预留的住宅

# ---------- 玩法平衡 ----------
gameplay:
  equipment:
    repair-per-trade: 10.0
    blacksmith-repair-per-ingot: 15.0
  butcher:
    minimum-adults-per-species: 2
  container:
    minimum-occupied-slots: 6
    max-stacks-per-operation: 2

# ---------- 生电模式 ----------
redstone-mode:
  enabled: true
  protected-regions: []      # 可选只读预置区域：name/world/x1/y1/z1/x2/y2/z2/owner
#    - world: "world"
#      x1: 100
#      y1: 60
#      z1: 100
#      x2: 200
#      y2: 80
#      z2: 200
#      name: "示例保护区"
#      owner: "PlayerName"

# ---------- 数据存储 ----------
storage:
  type: "sqlite"            # sqlite | mysql
  sqlite-file: "bettervillagers.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "bettervillagers"
    username: "root"
    password: ""
    params: "useSSL=false&useUnicode=true&characterEncoding=utf8"

# ---------- 村庄生成 ----------
village:
  detection-radius: 64      # 村庄半径覆盖判定
  king-spawn-population: 6  # 触发国王生成的最小人口
  entry-range-extra: 10
  entry-title:
    enabled: true
