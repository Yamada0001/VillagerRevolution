name: BetterVillagers
version: '${version}'
main: dev.bettervillagers.BetterVillagersPlugin
api-version: '26.2'
load: POSTWORLD
author: Yamada0001
description: 赋予 Minecraft 村民智能 AI 行为系统
website: https://github.com/Yamada0001/VillagerRevolution/
folia-supported: true
softdepend: [CraftEngine]

commands:
  bettervillagers:
    description: BetterVillagers 主命令
    usage: /bv help
    aliases: [bv]
    permission: bettervillagers.use
    permission-message: "&c你没有权限执行此命令。"

permissions:
  bettervillagers.use:
    description: 允许使用基础命令
    default: true
  bettervillagers.admin:
    description: 完全管理权限
    default: op
  bettervillagers.redstone.view:
    description: 查看生电保护区列表、详情与边界
    default: op
  bettervillagers.redstone.create:
    description: 创建生电保护区
    default: op
  bettervillagers.redstone.modify:
    description: 修改生电保护区
    default: op
  bettervillagers.redstone.delete:
    description: 删除生电保护区
    default: op
