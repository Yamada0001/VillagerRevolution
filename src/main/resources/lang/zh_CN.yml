    building-quota-full: "村庄 #{village} 已达到当前游戏日建造任务上限"
    building-y-too-low: "村庄 #{village} 建造命令 Y={command-y} 低于表层 Y={surface-y}，已拒绝"
    ai-provider-init: "AI 供应商已初始化: {provider}"
    recovery-start: "开始补录 {count} 个降级文件..."
    recovery-done: "降级补录完成，成功 {success}/{total}"
    recovery-fail: "补录 {file} 失败: {error}"
