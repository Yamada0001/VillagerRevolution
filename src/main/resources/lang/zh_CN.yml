    trade-error: "交易处理异常 {uuid}: {error}"
    data-dir-fail: "无法创建数据目录: {error}"
    prompt-read-fail: "读取 prompt.yml 失败: {error}"
    attr-set-fail: "设置属性 {key} 失败: {error}"
    version-missing: "[{file}] 缺少版本号 ({key})，当前插件期望版本 {expected}。建议删除该文件让插件重新生成。"
    version-mismatch: "[{file}] 版本不匹配：文件版本 {actual}，插件期望版本 {expected}。建议备份后删除该文件重新生成，或手动对照更新。"
